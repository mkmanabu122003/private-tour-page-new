[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["src/data/tourPrices.json"]

[build.processing]
  [build.processing.html]
    pretty_urls = false

# 301 redirects: old /routes/ URLs → new /tours/ URLs
[[redirects]]
  from = "/routes/ginza-the-luxury-shopping-district"
  to = "/tours/tsukiji-ginza"
  status = 301

[[redirects]]
  from = "/routes/asakusa-senso-ji-temple"
  to = "/tours/asakusa"
  status = 301

[[redirects]]
  from = "/routes/yanaka-old-town"
  to = "/tours/yanaka"
  status = 301

[[redirects]]
  from = "/routes/shibuya-harajuku"
  to = "/tours/shibuya-harajuku"
  status = 301

[[redirects]]
  from = "/routes/imperial-palace"
  to = "/tours/imperial-palace"
  status = 301

[[redirects]]
  from = "/routes/selection-of-temples-and-shrines"
  to = "/tours/asakusa"
  status = 301

[[redirects]]
  from = "/routes/shita-machi"
  to = "/tours/asakusa"
  status = 301

# Catch-all: any other old /routes/ URL → /tours listing page
[[redirects]]
  from = "/routes/*"
  to = "/tours"
  status = 301

# /custom-tours → /tours/custom redirect
[[redirects]]
  from = "/custom-tours"
  to = "/tours/custom"
  status = 301

# /booking → /contact redirect (no booking page exists)
[[redirects]]
  from = "/booking"
  to = "/contact"
  status = 301

# 301 redirects: other legacy URLs
[[redirects]]
  from = "/multi-day-tours"
  to = "/tours"
  status = 301

# Cannibalization fix: old Tsukiji food-lover guide → new Tsukiji Market guide
[[redirects]]
  from = "/blog/tsukiji-guide-food-lover"
  to = "/blog/tsukiji-market-guide"
  status = 301

# Cannibalization fix (ES): underperforming new article → established winner
[[redirects]]
  from = "/es/blog/mercado-tsukiji-tokio"
  to = "/es/blog/guia-tsukiji"
  status = 301

# 404: removed pages with no replacement
[[redirects]]
  from = "/policies"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/privacy-policy"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/cookies"
  to = "/404.html"
  status = 404

# Blog article consolidation: licensed guide article → hiring guide article
[[redirects]]
  from = "/blog/licensed-tour-guide-japan"
  to = "/blog/is-it-worth-hiring-a-tour-guide-in-tokyo"
  status = 301
  force = true

# Spanish blog article consolidation: licensed guide article → hiring guide article
[[redirects]]
  from = "/es/blog/guia-licencia-oficial-japon"
  to = "/es/blog/vale-la-pena-contratar-guia"
  status = 301
  force = true

# Spanish blog article consolidation: monte fuji duplicate → canonical
[[redirects]]
  from = "/es/blog/monte-fuji-desde-tokio"
  to = "/es/blog/monte-fuji-se-ve-desde-tokio"
  status = 301
  force = true

# Blog article consolidation: asakusa-guide-what-to-see → asakusa-guide
[[redirects]]
  from = "/blog/asakusa-guide-what-to-see"
  to = "/blog/asakusa-guide"
  status = 301
  force = true

# Legacy /es/tours/ slugs. Google crawled these in 2026-03 and they have been
# answering 200 with the English homepage ever since, so they are fixed here
# rather than left to the catch-all below.
[[redirects]]
  from = "/es/tours/kamakura"
  to = "/es/tours/kamakura-day-trip"
  status = 301

[[redirects]]
  from = "/es/tours/nikko"
  to = "/es/tours/nikko-day-trip"
  status = 301

# No Spanish page exists for these two tours — send readers to the Spanish
# tour listing rather than an English detail page.
[[redirects]]
  from = "/es/tours/tokyo-night-tour"
  to = "/es/tours"
  status = 301

[[redirects]]
  from = "/es/tours/tokyo-food-tour"
  to = "/es/tours"
  status = 301

# Catch-all (must be last).
#
# This used to be `to = "/index.html", status = 200`, the standard SPA fallback.
# Because every route is prerendered to its own HTML file, that rule only ever
# fired for URLs that do NOT exist — and answered them 200 with the prerendered
# English homepage, canonical and all. Googlebot saw a duplicate of "/" instead
# of a missing page: /es/tours/kamakura and /es/tours/nikko sat in Search
# Console as soft 404s and redirect errors for months on exactly this.
#
# Static files are matched before redirects (no `force` here), so the 166
# prerendered routes are unaffected — verified against the deploy preview, not
# just reasoned about. Netlify Forms posts to "/", which is a real file, so
# submissions are untouched.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
